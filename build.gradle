plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

base.archivesName = project.mod_id
group = project.mod_group
version = project.mod_version

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
    forge.mixinConfig "coraline_systems.mixins.json"
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://jitpack.io" }
    maven { url = "https://maven.misterpemodder.com/libs-release/" }
}

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    // mappings loom.officialMojangMappings() // Why is this commented out?
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
    }
    forge "net.minecraftforge:forge:$project.minecraft_version-$project.forge_version"

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"))
    include(implementation("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.7-beta.1"))

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    include(implementation("io.github.llamalad7:mixinextras-forge:0.5.0"))

    compileOnly "org.hid4java:hid4java:0.8.0"

    modCompileOnly("com.misterpemodder:shulkerboxtooltip-forge:4.0.4+1.20.1") { transitive false }

    // Mods:

    implementation("maven.modrinth:rediscovered:2.1.0")
    implementation("maven.modrinth:alexs-mobs:1.22.9")
    modImplementation("maven.modrinth:citadel:2.6.3")
    implementation("maven.modrinth:supplementaries:1.20-3.1.42-forge")
    implementation("maven.modrinth:moonlight:1.20-2.16.28-forge")
    implementation("maven.modrinth:quark:1.20.1-4.0-462")
    implementation("maven.modrinth:easel-does-it:1.0.8")
    implementation("maven.modrinth:caverns-and-chasms:2.1.2")
    implementation("maven.modrinth:spelunkery:1.20.1-0.3.16")
    implementation("maven.modrinth:etcetera:1.1.3")
    implementation("maven.modrinth:fancymenu:3.8.1-1.20.1-forge")
    implementation("maven.modrinth:crafttweaker:14.0.60")
    implementation("maven.modrinth:structure-gel-api:2.16.2")
    implementation("maven.modrinth:embeddium:0.3.31+mc1.20.1")

    // Using the Modrinth obfuscated implementations below, just because it's easier

    implementation("maven.modrinth:4q8UOK1d:Ci8SWnwn") // Subtle Effects 1.13.2
    implementation("maven.modrinth:6iTJugQR:73W8UHX3") // Amendments 2.2.5 for Cauldron integration
    implementation("maven.modrinth:twkfQtEc:Dn5LLrwn") // Moonlight
    implementation("maven.modrinth:l1rj36Ob:94eVgkTa") // Nostalgic Tweaks
    implementation("maven.modrinth:2JAUNCL4:j5eND1ZA") // Falling Leaves
    implementation("maven.modrinth:rex9wwpz:leymEt9o") // Spawn
    implementation("maven.modrinth:gTuTFFyz:nWAYgQaF") // Upgrade Aquatic for Mulberries!
    implementation("maven.modrinth:MVARlG2f:mSER3jBI") // Zeta to fix the Framed Glass issue
    implementation("maven.modrinth:G2K5sLls:Tzzphrug") // Controlify: Forgified

    // Test

    implementation("maven.modrinth:xkrdwmh2:TChqsR2O") // Moderner Beta
    // implementation("maven.modrinth:BiVApO4O:Au4nr4iP") // Fog Looks Good Now
    implementation("maven.modrinth:kFU5UCQz:JEwaLMli") // Picture Mode
    implementation("maven.modrinth:U9sJOFmJ:B9fN8ZSq") // Atmospheric
    implementation("maven.modrinth:QIuqlb7g:BH77zhu1") // Sweety Garden
}


processResources {
    filesMatching('META-INF/mods.toml') {
        expand project.properties
    }
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}